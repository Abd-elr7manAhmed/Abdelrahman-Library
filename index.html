<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>مكتبتي – برامج وروابط</title>
<style>
:root{--bg:#fff;--card:#fff;--text:#37352f;--muted:rgba(55,53,47,.6);--line:rgba(55,53,47,.12);--hover:rgba(55,53,47,.06);--accent:#37352f;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--card:#202020;--text:rgba(255,255,255,.85);--muted:rgba(255,255,255,.5);--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.06);--accent:rgba(255,255,255,.9);--accent-t:#191919}}
:root[data-theme="dark"]{--bg:#191919;--card:#202020;--text:rgba(255,255,255,.85);--muted:rgba(255,255,255,.5);--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.06);--accent:rgba(255,255,255,.9);--accent-t:#191919}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.card{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus:not(:focus-visible){outline:none}
input,select{-webkit-user-select:text;user-select:text}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Helvetica,Arial,sans-serif,"Apple Color Emoji";line-height:1.5;transition:background-color .2s,color .2s}
.wrap{max-width:720px;margin:0 auto;padding:clamp(16px,4vw,48px) clamp(16px,4vw,32px) 80px;padding-left:max(clamp(16px,4vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,32px),env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.top .row{align-items:center;gap:10px}
h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:700;margin:12px 0;letter-spacing:-.01em}
.logo{font-size:clamp(2rem,6vw,2.6rem);line-height:1}
.row,.bar{display:flex;gap:8px}
.bar{margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{flex:none;padding:8px 10px;min-height:36px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font:inherit;font-size:.95rem;cursor:pointer;border-radius:4px 4px 0 0;transition:background .12s}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
input,select{width:100%;min-width:0;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--hover);color:var(--text);font:inherit;font-size:16px;outline:none;transition:box-shadow .15s}
input:focus,select:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 22%,transparent)}
.btn{padding:6px 14px;min-height:36px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-t);font:inherit;font-size:.92rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .15s,background .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover);opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;padding:3px 10px;min-height:28px;border:0;border-radius:4px;background:var(--hover);color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;transition:background .12s}
.chip:hover{background:var(--line)}
.chip.on{background:var(--text);color:var(--bg)}
.panel{background:var(--hover);border-radius:6px;padding:12px 14px;margin-bottom:12px;display:none;flex-direction:column;gap:8px;font-size:.92rem}
.panel.show{display:flex}
.hide{display:none!important}
.owner-only{display:none}
body.owner .owner-only{display:block}
#form.show,#auth.show,#linkbox.show{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw);max-height:86vh;overflow:auto;background:var(--card);border-radius:10px;padding:16px;box-shadow:0 0 0 100vmax rgba(15,15,15,.5),0 0 0 1px var(--line),0 16px 48px rgba(0,0,0,.25);animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@media (min-width:700px){.panel#form.show{display:grid;grid-template-columns:1fr 1fr}#form>.row,#form>select{grid-column:1/-1}}
#list{display:flex;flex-direction:column;gap:2px}
.card{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:6px;background:transparent;transition:background .12s;animation:fade .25s ease backwards;animation-delay:calc(var(--i,0)*25ms)}
.card:hover{background:var(--hover)}
.ico{flex:none;width:24px;height:24px;margin-top:2px;border-radius:4px;display:grid;place-items:center;font-size:.9rem;font-weight:600;background:var(--hover);color:var(--muted)}
.ico.has{background:transparent}
.ico img{width:100%;height:100%;object-fit:contain;border-radius:3px}
.info{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.name{flex:1 1 140px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.acts a,.acts button{padding:3px 10px;min-height:28px;display:inline-flex;align-items:center;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:none;transition:background .12s}
.acts a:hover,.acts button:hover{background:var(--line)}
.acts a.go{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.acts a.go:hover{background:var(--accent);opacity:.88}
.star{flex:none;width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:1.05rem;cursor:pointer}
.star:hover{background:var(--line);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.sk{height:40px;background:var(--hover);animation:sh 1s ease-in-out infinite alternate}
@keyframes sh{to{opacity:.4}}
@keyframes fade{from{opacity:0}}
.small{color:var(--muted);font-size:.82rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:99;font-size:.88rem}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{position:relative;direction:ltr;display:flex;align-items:center;justify-content:space-between;width:58px;height:30px;padding:0 8px;border:0;border-radius:999px;background:var(--hover);color:var(--muted);font-size:.8rem;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--text);display:grid;place-items:center;font-style:normal;transition:transform .25s;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.15)}
.sw i::before{content:"☀"}
.sw[data-m="dark"] i{transform:translateX(28px)}
.sw[data-m="dark"] i::before{content:"☾"}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#who{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--hover);padding:4px 10px;border-radius:4px;direction:ltr}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (pointer:coarse){.acts a,.acts button{min-height:36px;padding:5px 12px;font-size:.88rem}.chip{min-height:34px}.star{width:36px;height:36px}.tab{min-height:44px}.btn{min-height:42px}}
@media (max-width:360px){.wrap{padding-left:12px;padding-right:12px}.acts a,.acts button{padding:5px 8px}.tab{padding:8px}}
@media (min-width:900px){.wrap{max-width:820px}body{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="row" style="align-items:center"><div class="logo">📚</div><h1>مكتبتي</h1></div>
    <div class="row">
      <span class="small hide" id="who"></span>
      <button class="btn ghost" id="authBtn">دخول / تسجيل</button>
      <button class="sw" id="theme" aria-label="تبديل الوضع"><span>☀</span><span>☾</span><i></i></button>
    </div>
  </div>
  <div class="panel" id="setup" style="border-style:dashed"><b>وضع التجربة</b><span class="small">دي عينة بس. عشان الدخول والحفظ يشتغلوا حط مفتاح Supabase في سطر SUPABASE_KEY جوه ملف index.html.</span></div>
  <div class="panel" id="auth">
    <input id="a-email" type="email" placeholder="الإيميل" dir="ltr" autocomplete="email">
    <input id="a-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="رمز التحقق من الإيميل" dir="ltr" maxlength="10" class="hide">
    <div class="row"><button class="btn" id="login">إرسال رمز الدخول</button><button class="btn ghost hide" id="verify">تأكيد الرمز</button></div>
    <div class="small" id="a-msg">اكتب بريدك وهنبعتلك رمز دخول. لو أول مرة هيتعمل لك حساب تلقائياً.</div>
  </div>
  <div class="panel" id="linkbox"><b>انسخ الرابط من هنا</b><input id="linkval" readonly dir="ltr"><button class="btn" id="linkclose">تم</button></div>
  <div class="panel" id="single"><div class="row"><span style="flex:1">بتشوف عنصر واحد مشارك معاك</span><button class="btn ghost" id="showAll">عرض الكل</button></div></div>
  <div class="tabs" id="tabs"><button class="tab on" id="t-app">البرامج</button><button class="tab" id="t-link">الروابط</button></div>
  <div class="bar" id="bar"><button class="btn hide" id="addBtn">+ إضافة</button></div>
  <div class="chips" id="chips"></div>
  <div class="panel" id="form">
    <input id="f-name" placeholder="الاسم">
    <input id="f-url" placeholder="الرابط (لينك التحميل أو الموقع)" dir="ltr">
    <input id="f-cat" placeholder="التصنيف (اختياري)">
    <input id="f-icon" placeholder="إيموجي بدل اللوجو (اختياري)" maxlength="4">
    <input id="f-note" placeholder="ملاحظة قصيرة (اختياري)">
    <select id="f-vis">
      <option value="public">عام – بيظهر للكل</option>
      <option value="unlisted">غير مُدرج – بلينكه بس</option>
      <option value="private">خاص – ليك إنت بس</option>
    </select>
    <div class="row"><button class="btn" id="save">حفظ</button><button class="btn ghost" id="cancel">إلغاء</button></div>
  </div>
  <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== إعدادات Supabase (من Project Settings > API) ======
var SUPABASE_URL='https://ubbfpyzigkclynwbrudp.supabase.co';
var SUPABASE_KEY='sb_publishable_hDF6BXATAFHgW0jDIuoRMQ_xUhsb59Z';
var SITE_URL='https://abd-elr7manahmed.github.io/Abdelrahman-Library/'; // اختياري: رابط موقعك بعد الرفع، مثال: https://username.github.io/repo/
// ===========================================================
(function(){
var $=function(i){return document.getElementById(i)};
var tt=el('div','toast');document.body.appendChild(tt);
function toast(m){tt.textContent=m;tt.classList.add('on');clearTimeout(tt._t);tt._t=setTimeout(function(){tt.classList.remove('on')},2600)}
var VIS={public:'عام',unlisted:'غير مُدرج',private:'خاص'};
var loading=true,sb,items=[],favs=[],single=null,user=null,owner=false,tab='app',catF='',editId=null;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fixUrl(u){u=(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u}
function one(){var m=/^#i-([0-9a-f-]{36})$/.exec(location.hash);return m?m[1]:null}
function isFav(i){return favs.indexOf(i.id)>-1}
try{var th=localStorage.getItem('hub_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
function mode(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function paint(){$('theme').dataset.m=mode()}
$('theme').onclick=function(){var nx=mode()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('hub_theme',nx)}catch(e){}paint()};
paint();
var demo=SUPABASE_URL.indexOf('PASTE')>-1||SUPABASE_KEY.indexOf('PASTE')>-1||!window.supabase;
var DEMO=[
 {id:'d1',type:'app',name:'My Life',url:'https://abd-elr7manahmed.github.io/Life1.3-/',cat:'شامل جوانب الحياة',note:'عينة تجريبية',vis:'public'},
 {id:'d2',type:'app',name:'برنامج تجريبي',url:'https://example.com',cat:'أدوات',note:'عينة تجريبية',vis:'public'},
 {id:'d3',type:'link',name:'GitHub',url:'https://github.com',cat:'برمجة',note:'عينة تجريبية',vis:'public'},
 {id:'d4',type:'link',name:'Supabase',url:'https://supabase.com',cat:'برمجة',note:'عينة تجريبية',vis:'public'}];
if(demo)$('setup').classList.add('show');
if(!demo)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function refresh(){
  if(demo){loading=false;render();return}
  owner=false;favs=[];single=null;
  if(user){
    var r=await sb.rpc('is_owner');owner=r.data===true;
    var f=await sb.from('favorites').select('item_id');favs=(f.data||[]).map(function(x){return x.item_id});
  }
  var q=await sb.from('items').select('*').order('created_at',{ascending:false});
  items=q.data||[];loading=false;
  var s=one();
  if(s){var g=await sb.rpc('get_item',{item_id:s});single=(g.data||[])[0]||null}
  render();
}
if(demo){items=DEMO;loading=false;setTimeout(render,0)}else sb.auth.onAuthStateChange(function(ev,sess){user=sess?sess.user:null;setTimeout(refresh,0)});
window.addEventListener('hashchange',function(){setTimeout(refresh,0)});

function chips(all){
  var cats=[];all.forEach(function(i){if(i.cat&&cats.indexOf(i.cat)<0)cats.push(i.cat)});
  if(catF&&catF!=='★'&&cats.indexOf(catF)<0)catF='';
  var opts=[['','الكل']];if(user)opts.push(['★','★ المفضلة']);
  cats.forEach(function(c){opts.push([c,c])});
  var box=$('chips');box.innerHTML='';if(opts.length<2)return;
  opts.forEach(function(o){var b=el('button','chip'+(catF===o[0]?' on':''),o[1]);b.onclick=function(){catF=o[0];render()};box.appendChild(b)});
}
function copyText(t){
  function legacy(){
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  function done(ok){
    if(ok){toast('تم نسخ الرابط ✓');return}
    $('linkval').value=t;$('linkbox').classList.add('show');$('linkval').focus();$('linkval').select();
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(legacy())})}
  else done(legacy());
}
function logo(i){
  var d=el('div','ico'),h='';
  d.textContent=i.icon||(i.name||'?').trim().charAt(0).toUpperCase();
  try{h=new URL(i.url).hostname}catch(e){}
  if(i.icon||!h)return d;
  var im=new Image();im.alt='';im.referrerPolicy='no-referrer';
  im.onload=function(){if(im.naturalWidth>=32){d.textContent='';d.classList.add('has');d.appendChild(im)}};
  im.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=128';
  return d;
}
function render(){
  var s=one(),list;
  $('who').textContent=owner?'Owner':'';
  $('who').classList.toggle('hide',!owner);
  $('authBtn').textContent=user?'خروج':'دخول / تسجيل';
  $('addBtn').classList.toggle('hide',!owner);
  $('single').classList.toggle('show',!!s);
  ['tabs','bar','chips'].forEach(function(k){$(k).style.display=s?'none':''});
  if(!s&&!owner)$('bar').style.display='none';
  if(s){list=single?[single]:[]}
  else{
    var all=items.filter(function(i){return i.type===tab});
    chips(all);
    var q='';
    list=all.filter(function(i){return (i.name+' '+(i.cat||'')+' '+(i.note||'')+' '+(i.url||'')).toLowerCase().indexOf(q)>-1&&(!catF||(catF==='★'?isFav(i):i.cat===catF))});
        if(user)list.sort(function(a,b){return (isFav(b)?1:0)-(isFav(a)?1:0)});
  }
  var box=$('list');box.innerHTML='';if(loading){for(var k=0;k<6;k++)box.appendChild(el('div','card sk'));return}
  if(!list.length){box.appendChild(el('div','empty',s?'العنصر ده مش متاح':'لسه مفيش حاجة هنا'));return}
  list.forEach(function(i,ix){
    var c=el('div','card');c.style.setProperty('--i',Math.min(ix,12));c.appendChild(logo(i));
    var inf=el('div','info');inf.appendChild(el('div','name',i.name));
    var a=el('div','acts');
    if(i.url){var g=el('a','go','فتح');g.href=i.url;g.target='_blank';g.rel='noopener noreferrer';a.appendChild(g)}
    if(i.vis!=='private'){var cl=el('button',null,'نسخ الرابط');cl.onclick=function(){
      var base=SITE_URL||location.href.split('#')[0];
      if(!/^https?:/.test(base)){toast('الرابط الحقيقي بيظهر بعد رفع الموقع على استضافة');return}
      if(demo){toast('ده عنصر تجريبي، الروابط الحقيقية بعد ربط Supabase');return}
      copyText(base+'#i-'+i.id)};a.appendChild(cl)}
    if(owner){
      var e=el('button',null,'تعديل');e.onclick=function(){openForm(i)};
      var d=el('button',null,'حذف');d.onclick=async function(){
        if(!confirm('تحذف «'+i.name+'»؟'))return;
        var r=await sb.from('items').delete().eq('id',i.id);if(r.error)toast(r.error.message);refresh()};
      a.appendChild(e);a.appendChild(d);
    }
    inf.appendChild(a);c.appendChild(inf);
    if(user){
      var st=el('button','star',isFav(i)?'★':'☆');st.setAttribute('aria-label','مفضلة');
      st.onclick=async function(){
        if(isFav(i))await sb.from('favorites').delete().eq('item_id',i.id);
        else await sb.from('favorites').insert({item_id:i.id});
        refresh()};
      c.appendChild(st);
    }
    box.appendChild(c);
  });
}
function openForm(i){
  editId=i?i.id:null;
  $('f-name').value=i?i.name:'';$('f-url').value=i?(i.url||''):'';$('f-cat').value=i?(i.cat||''):'';
  $('f-icon').value=i?(i.icon||''):'';$('f-note').value=i?(i.note||''):'';$('f-vis').value=i?i.vis:'public';
  $('form').classList.add('show');$('f-name').focus();
}
function closeForm(){$('form').classList.remove('show');editId=null}
$('save').onclick=async function(){
  var name=$('f-name').value.trim();if(!name){$('f-name').focus();return}
  var rec={name:name,url:fixUrl($('f-url').value),cat:$('f-cat').value.trim(),icon:$('f-icon').value.trim(),note:$('f-note').value.trim(),vis:$('f-vis').value};
  var r=editId?await sb.from('items').update(rec).eq('id',editId):await sb.from('items').insert(Object.assign({type:tab},rec));
  if(r.error){toast(r.error.message);return}
  closeForm();refresh();toast('تم الحفظ ✓');
};
$('cancel').onclick=closeForm;
$('linkclose').onclick=function(){$('linkbox').classList.remove('show')};
$('addBtn').onclick=function(){openForm(null)};
$('showAll').onclick=function(){location.hash=''};
function setTab(t){tab=t;catF='';$('t-app').classList.toggle('on',t==='app');$('t-link').classList.toggle('on',t==='link');closeForm();render()}
$('t-app').onclick=function(){setTab('app')};$('t-link').onclick=function(){setTab('link')};
// تسجيل الدخول برمز OTP إلى البريد الإلكتروني
$('authBtn').onclick=function(){
  if(demo){toast('ضيف مفتاح Supabase في الملف الأول');return}
  if(user){sb.auth.signOut();return}
  $('auth').classList.toggle('show');
};
function msg(t){$('a-msg').textContent=t}
$('login').onclick=async function(){
  var email=$('a-email').value.trim();
  if(!email){msg('اكتب البريد الإلكتروني أولاً.');return}
  $('login').disabled=true;msg('جاري إرسال رمز الدخول...');
  var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.href.split('#')[0]}});
  $('login').disabled=false;
  if(r.error){msg('تعذر إرسال الرمز: '+r.error.message);return}
  $('a-code').classList.remove('hide');$('verify').classList.remove('hide');
  msg('اتبعتلك إيميل. اضغط لينك الدخول اللي فيه، أو اكتب الرمز هنا لو ظاهر في الرسالة.');
};
$('verify').onclick=async function(){
  var email=$('a-email').value.trim(),token=$('a-code').value.trim();
  if(!email||!token){msg('اكتب البريد ورمز التحقق.');return}
  $('verify').disabled=true;msg('جاري التحقق...');
  var r=await sb.auth.verifyOtp({email:email,token:token,type:'email'});
  $('verify').disabled=false;
  if(r.error){msg('الرمز غير صحيح أو انتهت صلاحيته: '+r.error.message);return}
  $('auth').classList.remove('show');$('a-code').value='';msg('تم تسجيل الدخول بنجاح.');
};
document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeForm();$('auth').classList.remove('show')}
});
document.addEventListener('pointerdown',function(e){
  ['form','auth'].forEach(function(id){var p=$(id);
    if(p.classList.contains('show')&&!p.contains(e.target)&&e.target.id!=='addBtn'&&e.target.id!=='authBtn'){if(id==='form')closeForm();else p.classList.remove('show')}});
});
})();
</script>
</body>
</html>
