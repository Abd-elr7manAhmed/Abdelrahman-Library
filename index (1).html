<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140b0e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<title>مكتبتي – برامج وروابط</title>
<style>
:root{--bg:#f3eee8;--card:#fbf8f4;--text:#1e1215;--muted:#85767a;--line:rgba(30,18,21,.14);--hover:rgba(138,28,60,.06);--accent:#8a1c3c;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140b0e;--card:#1d1216;--text:#f2e9e6;--muted:#a08f94;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.05);--accent:#c9405f;--accent-t:#fff}}
:root[data-theme="dark"]{--bg:#140b0e;--card:#1d1216;--text:#f2e9e6;--muted:#a08f94;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.05);--accent:#c9405f;--accent-t:#fff}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.card{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button:focus:not(:focus-visible){outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",ui-sans-serif,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:clamp(14px,4vw,40px) clamp(16px,4vw,32px) 110px;padding-left:max(clamp(16px,4vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,32px),env(safe-area-inset-right,0px))}
.head{position:sticky;top:0;z-index:20;margin:0 calc(-1*clamp(16px,4vw,32px)) 8px;padding:10px clamp(16px,4vw,32px) 0;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .row{align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:46px;height:46px;border-radius:12px 12px 12px 4px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center}
.logo svg{width:62%;height:auto;display:block}
h1{margin:0;font:700 clamp(1.7rem,6vw,2.2rem)/1.1 "Reem Kufi","IBM Plex Sans Arabic",sans-serif}
.tag{font-size:.62rem;letter-spacing:.22em;font-weight:600;color:var(--muted);direction:ltr;text-align:right;margin-top:4px}
.row,.bar{display:flex;gap:8px}
#bar{display:none!important}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tab{flex:none;padding:6px 2px 10px;min-height:42px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font:600 1.2rem/1.2 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;cursor:pointer;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
input,select{width:100%;min-width:0;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:none;transition:box-shadow .15s,border-color .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
.btn{padding:6px 16px;min-height:40px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-t);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active,.chip:active,.acts a:active,.menu button:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chip{flex:none;padding:4px 14px;min-height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.chip:hover{color:var(--text);background:var(--hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.panel{background:var(--hover);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:none;flex-direction:column;gap:8px;font-size:.92rem}
.panel.show{display:flex}
.hide{display:none!important}
.owner-only{display:none}
body.owner .owner-only{display:block}
#form.show,#auth.show,#linkbox.show{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw);max-height:86vh;overflow:auto;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 0 0 100vmax rgba(20,8,12,.55),0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.35);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@media (min-width:700px){.panel#form.show{display:grid;grid-template-columns:1fr 1fr}#form>.row,#form>select{grid-column:1/-1}}
#palette.show{flex-direction:row;justify-content:center;flex-wrap:wrap;gap:14px}
.sx{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sx.on{box-shadow:0 0 0 2px var(--text)}
#list{display:flex;flex-direction:column;padding-top:6px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);background:transparent;transition:background .15s;animation:fade .3s ease backwards;animation-delay:calc(var(--i,0)*30ms)}
.card::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .18s}
.card:hover{background:var(--hover)}
.card:hover::before{transform:scaleY(1)}
.num{flex:none;width:26px;direction:ltr;text-align:center;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.ico{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:1rem;font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.ico.has{background:#fff;border:1px solid var(--line);padding:5px}
.ico img{width:100%;height:100%;object-fit:contain;border-radius:3px}
.info{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.name{flex:1;min-width:0;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.acts a.go{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;min-height:34px;border-radius:8px;background:var(--accent);color:var(--accent-t);font-weight:600;font-size:.88rem;text-decoration:none;transition:filter .15s}
.acts a.go::after{content:"↗";font-size:.8rem}
.acts a.go:hover{filter:brightness(1.12)}
.star,.more{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;transition:background .12s,color .12s}
.star{font-size:1.15rem}
.more{font-size:1.4rem;line-height:1}
.star:hover,.more:hover{background:var(--hover);color:var(--text)}
.menu{position:absolute;left:8px;top:calc(100% - 8px);z-index:15;min-width:150px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35);display:none;flex-direction:column}
.menu.open{display:flex;animation:drop .12s ease}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.menu button{border:0;background:transparent;color:var(--text);font:inherit;font-size:.92rem;text-align:start;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu .danger{color:#e5484d}
.fab{position:fixed;z-index:30;inset-inline-end:max(20px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-t);font-size:1.9rem;line-height:1;cursor:pointer;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.fab:active{transform:scale(.92)}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.sk{height:58px;background:var(--hover);border-bottom-color:transparent;animation:sh 1s ease-in-out infinite alternate}
@keyframes sh{to{opacity:.4}}
@keyframes fade{from{opacity:0}}
.small{color:var(--muted);font-size:.82rem}
#who{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 10px;border-radius:6px;direction:ltr}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:99;font-size:.88rem}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dotbtn{flex:none;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--bg);background:var(--accent);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw{position:relative;direction:ltr;display:flex;align-items:center;justify-content:space-between;width:58px;height:30px;padding:0 8px;border:0;border-radius:999px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:.8rem;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-style:normal;transition:transform .25s}
.sw i::before{content:"☀"}
.sw[data-m="dark"] i{transform:translateX(28px)}
.sw[data-m="dark"] i::before{content:"☾"}
@media (pointer:coarse){.acts a.go{min-height:38px}.chip{min-height:36px}.tab{min-height:46px}.btn{min-height:44px}}
@media (max-width:360px){.wrap{padding-left:12px;padding-right:12px}.num{display:none}.card{gap:10px}}
@media (min-width:900px){.wrap{max-width:820px}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.no-tr *:not(i),html.no-tr *::before,html.no-tr *::after{transition:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
  <div class="top">
    <div class="brand"><div class="logo"><svg viewBox="62 70 200 182" aria-hidden="true"><rect x="62" y="70" width="176" height="44" rx="14" fill="currentColor"/><rect x="86" y="128" width="176" height="44" rx="14" fill="currentColor" opacity=".6"/><rect x="62" y="186" width="162" height="44" rx="14" fill="currentColor"/><rect x="70" y="240" width="160" height="12" rx="6" fill="#1b0f12" opacity=".55"/></svg></div><div><h1>مكتبتي</h1><div class="tag">ABDELRAHMAN · LIBRARY</div></div></div>
    <div class="row">
      <span class="small hide" id="who"></span>
      <button class="btn ghost" id="authBtn">دخول / تسجيل</button>
      <button class="dotbtn" id="colorBtn" aria-label="لون الموقع"></button>
      <button class="sw" id="theme" aria-label="تبديل الوضع"><span>☀</span><span>☾</span><i></i></button>
    </div>
  </div>
  <div class="tabs" id="tabs"><button class="tab on" id="t-app">البرامج</button><button class="tab" id="t-link">الروابط</button></div>
  </header>
  <div class="panel" id="palette"></div>
  <div class="panel" id="auth">
    <input id="a-email" type="email" placeholder="الإيميل" dir="ltr" autocomplete="email">
    <input id="a-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="رمز التحقق من الإيميل" dir="ltr" maxlength="10" class="hide">
    <div class="row"><button class="btn" id="login">إرسال رمز الدخول</button><button class="btn ghost hide" id="verify">تأكيد الرمز</button></div>
    <div class="small" id="a-msg">اكتب بريدك وهنبعتلك رمز دخول. لو أول مرة هيتعمل لك حساب تلقائياً.</div>
  </div>
  <div class="panel" id="linkbox"><b>انسخ الرابط من هنا</b><input id="linkval" readonly dir="ltr"><button class="btn" id="linkclose">تم</button></div>
  <div class="panel" id="single"><div class="row"><span style="flex:1">بتشوف عنصر واحد مشارك معاك</span><button class="btn ghost" id="showAll">عرض الكل</button></div></div>
  <div class="bar" id="bar"></div>
  <div class="chips" id="chips"></div>
  <div class="panel" id="form">
    <input id="f-name" placeholder="الاسم">
    <input id="f-url" placeholder="الرابط (لينك التحميل أو الموقع)" dir="ltr">
    <input id="f-cat" placeholder="التصنيف (اختياري)">
    <input id="f-icon" placeholder="إيموجي بدل اللوجو (اختياري)" maxlength="4">
    <input id="f-note" placeholder="ملاحظة قصيرة (اختياري)">
    <select id="f-vis">
      <option value="public">عام – بيظهر للكل</option>
      <option value="unlisted">غير مُدرج – بلينكه بس</option>
      <option value="private">خاص – ليك إنت بس</option>
    </select>
    <div class="row"><button class="btn" id="save">حفظ</button><button class="btn ghost" id="cancel">إلغاء</button></div>
  </div>
  <div id="list"></div>
  <button class="fab hide" id="addBtn" aria-label="إضافة">+</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== إعدادات Supabase (من Project Settings > API) ======
var SUPABASE_URL='https://ubbfpyzigkclynwbrudp.supabase.co';
var SUPABASE_KEY='sb_publishable_hDF6BXATAFHgW0jDIuoRMQ_xUhsb59Z';
var SITE_URL='https://abd-elr7manahmed.github.io/Abdelrahman-Library/'; // اختياري: رابط موقعك بعد الرفع، مثال: https://username.github.io/repo/
// ===========================================================
(function(){
var $=function(i){return document.getElementById(i)};
var tt=el('div','toast');document.body.appendChild(tt);
function toast(m){tt.textContent=m;tt.classList.add('on');clearTimeout(tt._t);tt._t=setTimeout(function(){tt.classList.remove('on')},2600)}
var VIS={public:'عام',unlisted:'غير مُدرج',private:'خاص'};
var loading=true,sb,items=[],favs=[],single=null,user=null,owner=false,tab='app',catF='',editId=null;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fixUrl(u){u=(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u}
function one(){var m=/^#i-([0-9a-f-]{36})$/.exec(location.hash);return m?m[1]:null}
function isFav(i){return favs.indexOf(i.id)>-1}
try{var th=localStorage.getItem('hub_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
function mode(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function paint(){$('theme').dataset.m=mode()}
$('theme').onclick=function(){var h=document.documentElement,nx=mode()==='dark'?'light':'dark';h.classList.add('no-tr');h.setAttribute('data-theme',nx);try{localStorage.setItem('hub_theme',nx)}catch(e){}paint();setTimeout(function(){h.classList.remove('no-tr')},80)};
paint();
var noDb=SUPABASE_URL.indexOf('PASTE')>-1||SUPABASE_KEY.indexOf('PASTE')>-1||!window.supabase;
if(!noDb)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function refresh(){
  if(noDb){loading=false;render();return}
  owner=false;favs=[];single=null;
  if(user){
    var r=await sb.rpc('is_owner');owner=r.data===true;
    var f=await sb.from('favorites').select('item_id');favs=(f.data||[]).map(function(x){return x.item_id});
  }
  var q=await sb.from('items').select('*').order('created_at',{ascending:false});
  items=q.data||[];loading=false;
  var s=one();
  if(s){var g=await sb.rpc('get_item',{item_id:s});single=(g.data||[])[0]||null}
  render();
}
if(noDb){loading=false;setTimeout(render,0)}else sb.auth.onAuthStateChange(function(ev,sess){user=sess?sess.user:null;setTimeout(refresh,0)});
window.addEventListener('hashchange',function(){setTimeout(refresh,0)});

function chips(all){
  var cats=[];all.forEach(function(i){if(i.cat&&cats.indexOf(i.cat)<0)cats.push(i.cat)});
  if(catF&&catF!=='★'&&cats.indexOf(catF)<0)catF='';
  var opts=[['','الكل']];if(user)opts.push(['★','★ المفضلة']);
  cats.forEach(function(c){opts.push([c,c])});
  var box=$('chips');box.innerHTML='';if(opts.length<2)return;
  opts.forEach(function(o){var b=el('button','chip'+(catF===o[0]?' on':''),o[1]);b.onclick=function(){catF=o[0];render()};box.appendChild(b)});
}
function copyText(t){
  function legacy(){
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  function done(ok){
    if(ok){toast('تم نسخ الرابط ✓');return}
    $('linkval').value=t;$('linkbox').classList.add('show');$('linkval').focus();$('linkval').select();
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(legacy())})}
  else done(legacy());
}
function closeMenus(){[].forEach.call(document.querySelectorAll('.menu.open'),function(m){m.classList.remove('open')})}
function copyItem(i){
  var base=SITE_URL||location.href.split('#')[0];
  if(!/^https?:/.test(base)){toast('الرابط الحقيقي بيظهر بعد رفع الموقع على استضافة');return}
  copyText(base+'#i-'+i.id);
}
function logo(i){
  var d=el('div','ico'),h='';
  d.textContent=i.icon||(i.name||'?').trim().charAt(0).toUpperCase();
  try{h=new URL(i.url).hostname}catch(e){}
  if(i.icon||!h)return d;
  var im=new Image();im.alt='';im.referrerPolicy='no-referrer';
  im.onload=function(){if(im.naturalWidth>=32){d.textContent='';d.classList.add('has');d.appendChild(im)}};
  im.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=128';
  return d;
}
function render(){
  var s=one(),list;
  $('who').textContent=owner?'Owner':'';
  $('who').classList.toggle('hide',!owner);
  $('authBtn').textContent=user?'خروج':'دخول / تسجيل';
  $('addBtn').classList.toggle('hide',!owner);
  $('single').classList.toggle('show',!!s);
  ['tabs','bar','chips'].forEach(function(k){$(k).style.display=s?'none':''});
  if(!s&&!owner)$('bar').style.display='none';
  if(s){list=single?[single]:[]}
  else{
    var all=items.filter(function(i){return i.type===tab});
    chips(all);
    var q='';
    list=all.filter(function(i){return (i.name+' '+(i.cat||'')+' '+(i.note||'')+' '+(i.url||'')).toLowerCase().indexOf(q)>-1&&(!catF||(catF==='★'?isFav(i):i.cat===catF))});
        if(user)list.sort(function(a,b){return (isFav(b)?1:0)-(isFav(a)?1:0)});
  }
  var box=$('list');box.innerHTML='';if(loading){for(var k=0;k<6;k++)box.appendChild(el('div','card sk'));return}
  if(!list.length){box.appendChild(el('div','empty',noDb?'الموقع مش متوصل بقاعدة البيانات':s?'العنصر ده مش متاح':(owner?'لسه مفيش حاجة هنا. اضغط + عشان تضيف أول عنصر':'لسه مفيش حاجة هنا')));return}
  list.forEach(function(i,ix){
    var c=el('div','card');c.style.setProperty('--i',Math.min(ix,12));c.appendChild(el('div','num',ix<9?'0'+(ix+1):String(ix+1)));c.appendChild(logo(i));
    var inf=el('div','info');inf.appendChild(el('div','name',i.name));
    var a=el('div','acts');
    if(i.url){var g=el('a','go','فتح');g.href=i.url;g.target='_blank';g.rel='noopener noreferrer';a.appendChild(g)}
    inf.appendChild(a);c.appendChild(inf);
    if(user){
      var st=el('button','star',isFav(i)?'★':'☆');st.setAttribute('aria-label','مفضلة');
      st.onclick=async function(){
        if(isFav(i))await sb.from('favorites').delete().eq('item_id',i.id);
        else await sb.from('favorites').insert({item_id:i.id});
        refresh()};
      c.appendChild(st);
    }
    var mi=[];
    if(i.vis!=='private')mi.push(['نسخ الرابط',function(){copyItem(i)}]);
    if(owner){
      mi.push(['تعديل',function(){openForm(i)}]);
      mi.push(['حذف',async function(){
        if(!confirm('تحذف «'+i.name+'»؟'))return;
        var r=await sb.from('items').delete().eq('id',i.id);if(r.error)toast(r.error.message);refresh()},'danger']);
    }
    if(mi.length){
      var mb=el('button','more','⋯');mb.setAttribute('aria-label','المزيد');
      var mn=el('div','menu');
      mi.forEach(function(it){var bt=el('button',it[2]||null,it[0]);bt.onclick=function(){mn.classList.remove('open');it[1]()};mn.appendChild(bt)});
      mb.onclick=function(){var o=mn.classList.contains('open');closeMenus();if(!o)mn.classList.add('open')};
      c.appendChild(mb);c.appendChild(mn);
    }
    box.appendChild(c);
  });
}
function openForm(i){
  editId=i?i.id:null;
  $('f-name').value=i?i.name:'';$('f-url').value=i?(i.url||''):'';$('f-cat').value=i?(i.cat||''):'';
  $('f-icon').value=i?(i.icon||''):'';$('f-note').value=i?(i.note||''):'';$('f-vis').value=i?i.vis:'public';
  $('form').classList.add('show');$('f-name').focus();
}
function closeForm(){$('form').classList.remove('show');editId=null}
$('save').onclick=async function(){
  var name=$('f-name').value.trim();if(!name){$('f-name').focus();return}
  var rec={name:name,url:fixUrl($('f-url').value),cat:$('f-cat').value.trim(),icon:$('f-icon').value.trim(),note:$('f-note').value.trim(),vis:$('f-vis').value};
  var r=editId?await sb.from('items').update(rec).eq('id',editId):await sb.from('items').insert(Object.assign({type:tab},rec));
  if(r.error){toast(r.error.message);return}
  closeForm();refresh();toast('تم الحفظ ✓');
};
$('cancel').onclick=closeForm;
var PAL=['neutral','#2383e2','#6d5ae6','#0d9488','#16a34a','#ea580c'];
function setAccent(c,save){
  var r=document.documentElement.style;
  if(c==='neutral'){r.removeProperty('--accent');r.removeProperty('--accent-t')}
  else{r.setProperty('--accent',c);r.setProperty('--accent-t','#fff')}
  if(save){try{localStorage.setItem('hub_accent',c)}catch(e){}}
  [].forEach.call($('palette').children,function(b){b.classList.toggle('on',b.dataset.c===c)});
}
PAL.forEach(function(c){
  var b=el('button','sx');b.dataset.c=c;b.setAttribute('aria-label','لون');
  b.style.background=c==='neutral'?'#8a1c3c':c;
  b.onclick=function(){setAccent(c,true)};$('palette').appendChild(b);
});
var sa='neutral';try{sa=localStorage.getItem('hub_accent')||sa}catch(e){}
setAccent(sa,false);
$('colorBtn').onclick=function(){$('palette').classList.toggle('show')};
document.addEventListener('pointerdown',function(e){
  if(!e.target.closest('.menu,.more'))closeMenus();
  if($('palette').classList.contains('show')&&!e.target.closest('#palette,#colorBtn'))$('palette').classList.remove('show');
});
$('linkclose').onclick=function(){$('linkbox').classList.remove('show')};
$('addBtn').onclick=function(){openForm(null)};
$('showAll').onclick=function(){location.hash=''};
function setTab(t){tab=t;catF='';$('t-app').classList.toggle('on',t==='app');$('t-link').classList.toggle('on',t==='link');closeForm();render()}
$('t-app').onclick=function(){setTab('app')};$('t-link').onclick=function(){setTab('link')};
// تسجيل الدخول برمز OTP إلى البريد الإلكتروني
$('authBtn').onclick=function(){
  if(noDb){toast('الموقع مش متوصل بقاعدة البيانات');return}
  if(user){sb.auth.signOut();return}
  $('auth').classList.toggle('show');
};
function msg(t){$('a-msg').textContent=t}
$('login').onclick=async function(){
  var email=$('a-email').value.trim();
  if(!email){msg('اكتب البريد الإلكتروني أولاً.');return}
  $('login').disabled=true;msg('جاري إرسال رمز الدخول...');
  var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.href.split('#')[0]}});
  $('login').disabled=false;
  if(r.error){msg('تعذر إرسال الرمز: '+r.error.message);return}
  $('a-code').classList.remove('hide');$('verify').classList.remove('hide');
  msg('اتبعتلك إيميل. اضغط لينك الدخول اللي فيه، أو اكتب الرمز هنا لو ظاهر في الرسالة.');
};
$('verify').onclick=async function(){
  var email=$('a-email').value.trim(),token=$('a-code').value.trim();
  if(!email||!token){msg('اكتب البريد ورمز التحقق.');return}
  $('verify').disabled=true;msg('جاري التحقق...');
  var r=await sb.auth.verifyOtp({email:email,token:token,type:'email'});
  $('verify').disabled=false;
  if(r.error){msg('الرمز غير صحيح أو انتهت صلاحيته: '+r.error.message);return}
  $('auth').classList.remove('show');$('a-code').value='';msg('تم تسجيل الدخول بنجاح.');
};
document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeForm();$('auth').classList.remove('show')}
});
document.addEventListener('pointerdown',function(e){
  ['form','auth'].forEach(function(id){var p=$(id);
    if(p.classList.contains('show')&&!p.contains(e.target)&&e.target.id!=='addBtn'&&e.target.id!=='authBtn'){if(id==='form')closeForm();else p.classList.remove('show')}});
});
})();
</script>
</body>
</html>
